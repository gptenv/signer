name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signer-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and validate Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm exec -- cf build --mode production
      - run: npm exec -- cf deploy --prebuilt --mode production --dry-run

  deploy:
    name: Deploy to Cloudflare production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci
      - run: npm exec -- cf build --mode production
      - name: Deploy tested main commit
        env:
          PRODUCTION_ENABLED: ${{ vars.SIGNER_PRODUCTION_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SIGNER_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.SIGNER_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is already on main. Skipping this deployment.'
            exit 0
          fi
          if [[ "$PRODUCTION_ENABLED" != 'true' || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure the protected production environment before enabling deployments.'
            exit 1
          fi
          npm exec -- cf deploy --prebuilt --mode production --no-provision --tag "$GITHUB_SHA"
